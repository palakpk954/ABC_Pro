version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: allocate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: allocate_user
      POSTGRES_PASSWORD: allocate_password
      POSTGRES_DB: allocate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allocate_user -d allocate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: allocate-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://allocate_user:allocate_password@db:5432/allocate_db
      - SECRET_KEY=super-secret-production-random-key-change-in-prod-allocate-2026
      - ENVIRONMENT=development
      - SOLVER_TIME_LIMIT_SECONDS=30
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: allocate-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
